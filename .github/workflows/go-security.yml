name: HWcontrol Security CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go scanner tests and vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build scanner
        run: go build ./cmd/hwscan
      - name: Dependency vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  ada-spark-policy:
    name: Ada policy compile, smoke tests, and SPARK proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GNAT, GPRbuild, and GNATprove using Alire
        uses: alire-project/alr-install@v2
        with:
          crates: gnat_native gprbuild gnatprove
      - name: Compile policy with assertions
        run: gprbuild -P ada/security_policy.gpr
      - name: Run exhaustive policy truth-table tests
        run: ./ada/bin/policy_smoke_test
      - name: Run SPARK flow analysis and proof
        run: gnatprove -P ada/security_policy.gpr --mode=prove
