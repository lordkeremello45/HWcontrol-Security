name: HWcontrol Security CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go scanner tests and vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build scanner
        run: go build ./cmd/hwscan
      - name: Dependency vulnerability analysis
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  ada-spark-policy:
    name: Ada policy compile and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GNAT and GPRbuild
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnat gprbuild
      - name: Compile policy with assertions
        run: gprbuild -P ada/security_policy.gpr
      - name: Run policy smoke tests
        run: ./ada/bin/policy_smoke_test
